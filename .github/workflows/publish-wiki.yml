name: Publish wiki (one-off bootstrap)

# Copies the pages in wiki/ into the GitHub Wiki. Run it once by hand (Actions tab ->
# "Publish wiki" -> Run workflow) after enabling the Wiki in the repo settings and creating its
# first page. After that the wiki is the source of truth: edit pages there, and delete this
# workflow and the wiki/ folder.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}.wiki
          path: wiki-repo
      - name: Copy pages
        run: cp -r wiki/. wiki-repo/
      - name: Commit and push
        working-directory: wiki-repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "Nothing to publish"; exit 0; }
          git commit -m "Publish wiki pages from ${GITHUB_SHA::7}"
          git push
