<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NtBA — Not the Basketball Association</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 8 8%27%3E%3Ccircle cx=%274%27 cy=%274%27 r=%274%27 fill=%27%23e86818%27/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <canvas id="screen" width="320" height="200" tabindex="0" aria-label="NtBA game screen"></canvas>
    <p id="status" role="status">Loading…</p>
    <p class="help">
      <kbd>←↑↓→</kbd>/<kbd>WASD</kbd> move &nbsp;·&nbsp; <kbd>X</kbd>/<kbd>K</kbd> shoot &nbsp;·&nbsp;
      <kbd>Z</kbd>/<kbd>J</kbd> pass (toward the direction you hold) &nbsp;·&nbsp; <kbd>C</kbd>/<kbd>Space</kbd> switch player &nbsp;·&nbsp;
      <kbd>Enter</kbd> restart after the final buzzer
    </p>
  </main>
  <script type="module" src="main.js"></script>
</body>
</html>
